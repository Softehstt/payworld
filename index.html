<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayWorld — Стена Желаний</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body {
            background-color: #0f0f0f; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px;
            background-image: radial-gradient(circle at top, #1b2a3d, #0f0f0f 60%);
        }
        h1 { font-size: 2.5rem; text-align: center; margin-bottom: 10px; background: -webkit-linear-gradient(45deg, #00ccff, #3333ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: #aaa; text-align: center; margin-bottom: 30px; font-size: 0.9rem; }
        
        .form-container {
            background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 15px; width: 100%; max-width: 500px; margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
        }
        input, textarea {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333;
            background: #1a1a1a; color: #fff; font-size: 1rem; outline: none; transition: 0.3s;
        }
        input:focus, textarea:focus { border-color: #00ccff; }
        button {
            width: 100%; padding: 15px; border: none; border-radius: 8px; background: linear-gradient(45deg, #00ccff, #3333ff);
            color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 204, 255, 0.4); }

        .wall { width: 100%; max-width: 800px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .wish-card {
            background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; justify-content: space-between; animation: fadeIn 0.5s ease-out;
        }
        .wish-text { font-size: 1.1rem; margin-bottom: 15px; line-height: 1.5; }
        .wish-author { font-size: 0.8rem; color: #888; text-align: right; font-style: italic; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <h1>PayWorld</h1>
    <p class="subtitle">Напиши, что ты хочешь. Анонимно или открыто. Вдруг кто-то богатый прочитает?</p>

    <div class="form-container">
        <input type="text" id="author" placeholder="Твое имя (или оставь пустым для анонимности)">
        <textarea id="wishText" rows="3" placeholder="Чего ты хочешь? (Например: Хочу наушники AirPods)"></textarea>
        <button onclick="addWish()">Опубликовать желание</button>
    </div>

    <div class="wall" id="wishWall">
        <!-- Сюда будут загружаться желания -->
    </div>

    <!-- Подключаем Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Твой конфиг Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDpLmrExe1ea7ubb_qcTYUk3GLZknLoglw",
            authDomain: "payworld-42e23.firebaseapp.com",
            projectId: "payworld-42e23",
            storageBucket: "payworld-42e23.firebasestorage.app",
            messagingSenderId: "573548544025",
            appId: "1:573548544025:web:1d1ffc278f10b2a7ae6a88"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const wishesRef = collection(db, "wishes");

        window.addWish = async function() {
            const author = document.getElementById('author').value.trim() || "Аноним";
            const text = document.getElementById('wishText').value.trim();
            
            if(!text) { alert("Напиши хотя бы само желание!"); return; }

            try {
                await addDoc(wishesRef, {
                    author: author,
                    text: text,
                    createdAt: serverTimestamp()
                });
                document.getElementById('wishText').value = '';
                document.getElementById('author').value = '';
            } catch (e) {
                console.error("Ошибка: ", e);
                alert("Ошибка при отправке. Проверь консоль (F12).");
            }
        }

        const q = query(wishesRef, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const wall = document.getElementById('wishWall');
            wall.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = 'wish-card';
                card.innerHTML = `
                    <div class="wish-text">«${data.text}»</div>
                    <div class="wish-author">— ${data.author}</div>
                `;
                wall.appendChild(card);
            });
        });
    </script>
</body>
</html>
